<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glücksrad</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background-color: #f0f0f0;
    }
    canvas {
      border: 5px solid #333;
      border-radius: 50%;
      background-color: #fff;
    }
    #spinButton {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
    }
    #winner {
      margin-top: 20px;
      font-size: 24px;
      font-weight: bold;
      color: #d9534f;
    }
  </style>
</head>
<body>

<h1>Glücksrad</h1>
<canvas id="wheel" width="800" height="800"></canvas>
<br>
<button id="spinButton">Drehen!</button>
<div id="winner"></div>

<script>
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const segments = ["Die famosen Dosen", "Quizzen mit Freunden", "KOSTENLOSE MÜNZE", "Bogenschießen Extrem", "Der tolle Hecht", "KOSTENLOSE MÜNZE", "Pikante Peinlichkeiten", "Wer zuletzt lacht", "KOSTENLOSE MÜNZE", "Der betrunkene Elch", "Armageddon", "KOSTENLOSE MÜNZE"];
  let colors = ["#FF6384", "#36A2EB", "#FFCC00", "#FFCE56", "#8AFF33", "#FFCC00", "#FF8A33", "#33FFD5", "#FFCC00", "#A64AFF", "#FF6F00", "#FFCC00"];
  const size = segments.length;
  const angle = 2 * Math.PI / size;
  let rotation = 0;

  function drawWheel() {
    for (let i = 0; i < size; i++) {
      ctx.beginPath();
      ctx.moveTo(400, 400);
      ctx.arc(400, 400, 400, i * angle, (i + 1) * angle);
      ctx.fillStyle = colors[i % colors.length];
      ctx.fill();
      ctx.stroke();

      // Text
      ctx.save();
      ctx.translate(400, 400);
      ctx.rotate(i * angle + angle / 2);
      ctx.textAlign = "right";
      ctx.fillStyle = "#000";
      ctx.font = "18px Arial";
      ctx.fillText(segments[i], 360, 20);
      ctx.restore();
    }
  }

  function drawArrow() {
    ctx.fillStyle = "#333";
    ctx.beginPath();
    ctx.moveTo(740, 400); // oberer Punkt
    ctx.lineTo(800, 380);
    ctx.lineTo(800, 420);
    ctx.closePath();
    ctx.fill();
  }

  function spinWheel() {

    if (Math.random() * 100 > 90)
    {
        let newColors = [];
        newColors.push(colors[4]);
        newColors.push(colors[7]);
        newColors.push(colors[2]);
        newColors.push(colors[1]);
        newColors.push(colors[10]);
        newColors.push(colors[5]);
        newColors.push(colors[6]);
        newColors.push(colors[0]);
        newColors.push(colors[8]);
        newColors.push(colors[9]);
        newColors.push(colors[3]);
        newColors.push(colors[11]);
        colors = newColors;
    }

    document.getElementById("winner").textContent = "";
    const spins = Math.floor(Math.random() * 3) + 4; // 4-6 Umdrehungen
    const randomSegment = Math.floor(Math.random() * size);
    let finalAngle = spins * 2 * Math.PI + randomSegment * angle + (Math.random() * angle);
    const manipulatedAngle = randomSegment == 0 ? finalAngle : ((spins + 1) * 2 * Math.PI + (Math.random() * 2 * angle / 3) - angle);

    let start = null;

    const fakeAnimation = Math.floor(Math.random() * 1)

    const fakeAnimationMode = Math.floor() * 10;
    // 0: Keine Sichtbare animation
    // 1: Statisches Weiterdrehen kurz vor Ende

    function animate(timestamp) {
      if (!start) start = timestamp;
      const progress = timestamp - start;
      const duration = 4000; // 4 Sekunden
      const easing = 1 - Math.pow(1 - progress / duration, 3); // ease out cubic

      if (fakeAnimationMode < 7) finalAngle = manipulatedAngle;

      rotation = (progress < (duration - 800) || finalAngle == manipulatedAngle) ? finalAngle * easing : rotation + (angle * 0.1 * (1 - Math.pow(1 - rotation / manipulatedAngle, 3)));

      ctx.clearRect(0, 0, 800, 800);

      // Rad rotieren
      ctx.save();
      ctx.translate(400, 400);
      ctx.rotate(rotation);
      ctx.translate(-400, -400);
      drawWheel();
      ctx.restore();

      // Pfeil festzeichnen
      drawArrow();

        if (rotation < manipulatedAngle || size - 1 - Math.floor((rotation % (2 * Math.PI)) / angle) > 0) {
            requestAnimationFrame(animate);
        } else {
            const winnerIndex = 0;
            document.getElementById("winner").textContent = "Gewonnen: " + segments[(winnerIndex + size) % size];
        }
    }
    requestAnimationFrame(animate);
  }

  drawWheel();
  drawArrow();
  document.getElementById("spinButton").addEventListener("click", spinWheel);
</script>

</body>
</html>
